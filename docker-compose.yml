x-uffizzi:
  ingress:
    service: nocodb
    port: 8081

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: root_db
    deploy:
      resources:
        limits:
          memory: 500M
  mysql:
    environment:
      MYSQL_DATABASE: root_db
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: noco
    image: "mysql:8.3.0"
    deploy:
      resources:
        limits:
          memory: 500M
  nocodb:
    image: "${NOCODB_IMAGE:-nocodb/nocodb:latest}"
    ports:
      - "8081:8081"
    entrypoint: /bin/sh
    command: ["-c", "apk add wait4ports && wait4ports tcp://localhost:5432 && /usr/src/appEntry/start.sh"]
    env_file:
      - .env
    environment:
      PORT: 8081
      NC_DB: "pg://localhost:5432?u=postgres&p=password&d=root_db"
      NC_ADMIN_EMAIL: admin@nocodb.com
      NC_ADMIN_PASSWORD: password
      # SMTP configuration (can be overridden by .env file)
      NC_SMTP_FROM: "${NC_SMTP_FROM:-}"
      NC_SMTP_HOST: "${NC_SMTP_HOST:-}"
      NC_SMTP_PORT: "${NC_SMTP_PORT:-}"
      NC_SMTP_USERNAME: "${NC_SMTP_USERNAME:-}"
      NC_SMTP_PASSWORD: "${NC_SMTP_PASSWORD:-}"
      NC_SMTP_SECURE: "${NC_SMTP_SECURE:-false}"
      NC_SMTP_IGNORE_TLS: "${NC_SMTP_IGNORE_TLS:-false}"
      NC_SMTP_REJECT_UNAUTHORIZED: "${NC_SMTP_REJECT_UNAUTHORIZED:-false}"
    deploy:
      resources:
        limits:
          memory: 500M